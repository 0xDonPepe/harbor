name: release
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      # the frozen test copies; the real catalog is verified by the carlosalaniz/harbor-apps CI (decision 158)
      - run: pnpm catalog:verify tests/fixtures/catalog --quiet
      - run: pnpm catalog:hash --catalog tests/fixtures/catalog --check
      - run: pnpm openapi -- --check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Downloads the latest signed app catalog from carlosalaniz/harbor-apps, verifies it against the pinned
      # key and ships it as the offline seed (decision 158). Fails the release when none verifies.
      - name: Build release archive
        run: pnpm package
      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Hand-written notes live in docs/releases/v<version>.md (what to expect, what not to trust
      # yet). When the file exists it becomes the release body; the generated changelog is appended.
      - name: Pick release notes
        id: notes
        run: |
          f="docs/releases/v${{ steps.version.outputs.version }}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; else echo "path=" >> "$GITHUB_OUTPUT"; fi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Harbor ${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            release/harbor-${{ steps.version.outputs.version }}-linux-x64.tar.gz
            release/SHA256SUMS
            install.sh
          fail_on_unmatched_files: true
          generate_release_notes: true
